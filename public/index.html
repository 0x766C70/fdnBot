<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDN-Expert</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2129; --border: #2a3542;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4f9ee8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: var(--bg);
    color: var(--text); display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  header p { margin: 2px 0 0; font-size: .8rem; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 760px; margin: 0 auto 14px; }
  .msg .role { font-size: .72rem; color: var(--muted); margin-bottom: 3px; }
  .msg .body {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; white-space: pre-wrap;
    overflow-wrap: anywhere; line-height: 1.5;
  }
  .msg.user .body { border-color: var(--accent); }
  form {
    display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border);
    background: var(--panel); max-width: 800px; margin: 0 auto; width: 100%;
  }
  input[type="text"] {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: .95rem;
  }
  button {
    padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: .95rem;
  }
  button:disabled { opacity: .5; cursor: wait; }
  .error { color: #f0a0a0; }
  .search-badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; font-size: .66rem;
    border: 1px solid var(--accent); color: var(--accent); border-radius: 10px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<header>
  <h1>FDN-Expert</h1>
  <p>Agent expert IT, sp&eacute;cialiste de FDN &mdash; recherche limit&eacute;e &agrave; *.fdn.fr</p>
</header>
<div id="chat"></div>
<form id="form" autocomplete="off">
  <input id="input" type="text" placeholder="Posez votre question sur FDN ou sur l'IT..." required>
  <button id="send" type="submit">Envoyer</button>
</form>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const history = [];
// Memoire serveur : un fil (thread_id) unique par chargement de page.
const threadId = (crypto.randomUUID && crypto.randomUUID()) || ('thread-' + Date.now());

function addMsg(role, text, isError, searchBadge) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const r = document.createElement('div');
  r.className = 'role';
  r.textContent = role === 'user' ? 'Vous' : 'FDN-Expert';
  if (searchBadge) {
    const badge = document.createElement('span');
    badge.className = 'search-badge';
    badge.textContent = 'sources fdn.fr';
    r.appendChild(badge);
  }
  const b = document.createElement('div');
  b.className = 'body' + (isError ? ' error' : '');
  b.textContent = text;
  div.append(r, b);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = '';
  send.disabled = true;
  history.push({ role: 'user', content: text });
  addMsg('user', text);
  addMsg('bot', 'FDN-Expert réfléchit...');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, thread_id: threadId }),
    });
    const data = await res.json();
    const answer = data.answer || data.error || data.detail || 'Erreur inconnue.';
    history.push({ role: 'assistant', content: data.answer || '' });
    if (data.answer) {
      const r = chat.lastChild.querySelector('.role');
      if (data.search_used) {
        const badge = document.createElement('span');
        badge.className = 'search-badge';
        badge.textContent = 'sources fdn.fr';
        r.appendChild(badge);
      }
      chat.lastChild.querySelector('.body').textContent = answer;
    } else {
      // erreur : on n'insere pas la reponse dans l'historique
      history.pop();
      chat.lastChild.querySelector('.body').textContent = answer;
      chat.lastChild.querySelector('.body').classList.add('error');
    }
  } catch (err) {
    history.pop();
    chat.lastChild.querySelector('.body').textContent = 'Erreur: ' + err.message;
    chat.lastChild.querySelector('.body').classList.add('error');
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
